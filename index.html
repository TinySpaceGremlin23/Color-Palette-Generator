<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button id="toggleBtn" class="floating-toggle">☰</button>

  <div class="sidebar" id="sidebar">
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </div>

  <h1 id="mainTitle">Color Palette Generator</h1>

  <form id="colorForm">
    <input type="text" id="userInput" placeholder="Input..." required>
    <input type="number" id="userSize" placeholder="Size" min="3" max="10" required>
    <button type="submit" id="genBtn">Generate!</button>
  </form>

  <div id="colorContain"></div>

  <div class="circular-menu" id="circularMenu">
    <button id="mainActionBtn" class="menu-btn">+</button>
    <button id="copyAction" class="menu-item">Copy</button>
    <button id="saveAction" class="menu-item">Save</button>
    <button id="shareAction" class="menu-item">Share</button>
  </div>


<a href="https://www.instagram.com/tinyspacegremlin" target="_blank" id="watermark">
  <img src="images/watermark.jpg" alt="Watermark">
</a>

  <script src="script.js"></script>
</body>
</html>
